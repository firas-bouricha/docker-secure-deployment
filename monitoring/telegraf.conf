[agent]
  interval = "10s"
  hostname = "td2-host"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "ynov"
  bucket = "td2"

# Métriques système des conteneurs (CPU, RAM, I/O) via le proxy en lecture seule
[[inputs.docker]]
  endpoint = "tcp://socket-proxy:2375"
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu", "blkio", "network"]

# Métrique applicative : le service métier répond-il ?
[[inputs.http_response]]
  urls = ["http://web/"]
  method = "GET"
  response_timeout = "5s"