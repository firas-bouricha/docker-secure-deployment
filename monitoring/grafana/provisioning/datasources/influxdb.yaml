apiVersion: 1
datasources:
  - name: InfluxDB TD2
    uid: influxdb-td2
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: false
    jsonData:
      version: Flux
      organization: ynov
      defaultBucket: td2
    secureJsonData:
      token: $__file{/run/secrets/influx_token}