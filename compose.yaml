services:
  db:
    image: mariadb:11.4

    environment:
      MARIADB_DATABASE: td2
      MARIADB_USER: td2app
      MARIADB_PASSWORD_FILE: /run/secrets/db_app_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password

    secrets:
      - db_app_password
      - db_root_password

    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

  web:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    build:
      context: ./app

    image: ynov/td2-web:1.0

    ports:
      - "127.0.0.1:8080:80"

    environment:
      DB_HOST: db
      DB_NAME: td2
      DB_USER: td2app

    secrets:
      - db_app_password
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: [ "monitoring" ]
    environment:
      CONTAINERS: 1 # lecture de la liste et des stats des conteneurs
      INFO: 1
      POST: 0 # aucune écriture : impossible de créer/supprimer des conteneurs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring

  influxdb:
    image: influxdb:2.7
    profiles: [ "monitoring" ]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influx_admin_password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influx_token
      DOCKER_INFLUXDB_INIT_ORG: ynov
      DOCKER_INFLUXDB_INIT_BUCKET: td2
      DOCKER_INFLUXDB_INIT_RETENTION: 7d
    secrets:
      - influx_admin_password
      - influx_token
    volumes:
      - influx_data:/var/lib/influxdb2
    networks:
      - monitoring

  telegraf:
    image: telegraf:1.32
    profiles: [ "monitoring" ]
    user: telegraf
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ 'INFLUX_TOKEN="$$(cat /run/secrets/influx_token)" exec telegraf --config /etc/telegraf/telegraf.conf' ]
    secrets:
      - influx_token
    volumes:
      - ./monitoring/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - monitoring
      - frontend
    depends_on:
      - influxdb
      - socket-proxy

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [ "monitoring" ]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
      - influx_token
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
      - frontend
    depends_on:
      - influxdb

volumes:
  db_data:
  influx_data:
  grafana_data:

networks:
  frontend:
  backend:
    internal: true
  monitoring:
    internal: true

secrets:
  db_root_password:
    file: ./secrets/db_root_password
  db_app_password:
    file: ./secrets/db_app_password
  influx_admin_password:
    file: ./secrets/influx_admin_password
  influx_token:
    file: ./secrets/influx_token
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
